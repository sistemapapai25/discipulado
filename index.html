<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discipulado Águas Purificadoras</title>
    <meta
      name="description"
      content="WebApp para discipulado da igreja com vídeos, questionário e envio de respostas."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Progresso do discipulado">
        <div class="topbar-main">
          <div class="church-brand">
            <span class="church-logo" id="churchLogoMark" hidden></span>
            <img class="church-logo-image" id="churchLogoImage" alt="" hidden />
          </div>
          <div class="topbar-title">
            <p class="eyebrow" id="churchName">Igreja</p>
            <h1 id="studyTitle">Discipulado</h1>
          </div>
          <span class="progress-count" id="progressLabel">Início</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span class="progress-fill" id="progressFill"></span>
        </div>
      </header>

      <main class="workspace" id="app" aria-live="polite"></main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
